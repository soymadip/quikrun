name: Update Packages
run-name: "Publish Packages: ${{ github.event.workflow_run.head_branch || github.ref_name }}"

on:
  workflow_run:
    workflows: ["Create GitHub Release"]
    types:
      - completed

  push:
    branches: [main]
    paths:
      - "PKGBUILD"
      - "pyproject.toml"
      - "src/debian/**"
      - ".github/workflows/update-packages.yml"

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.4.0)"
        required: false
        type: string
      target:
        description: "Package target for manual runs"
        required: false
        type: choice
        options:
          - all
          - ubuntu
        default: all

concurrency:
  group: update-dist-packages
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  get-info:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')) ||
      (github.event_name == 'workflow_dispatch')

    outputs:
      version: ${{ steps.resolve-meta.outputs.version }}
      is_manual: ${{ steps.resolve-meta.outputs.is_manual }}
      pkgname: ${{ steps.resolve-meta.outputs.pkgname }}
      launchpad_ppa: ${{ steps.resolve-launchpad.outputs.ppa }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve metadata
        id: resolve-meta
        run: |
          # Get package name from repository name (lowercase)
          PKGNAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')

          # Workflow run
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            RAW_TAG="${{ github.event.workflow_run.head_branch }}"
            if [[ "$RAW_TAG" == "main" || -z "$RAW_TAG" ]]; then
              RAW_TAG=$(git describe --tags --abbrev=0)
            fi

            VERSION="${RAW_TAG#v}"
            IS_MANUAL="false"

          # Workflow dispatch with version input
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            IS_MANUAL="true"

          # Push or manual without version input: Read from file
          else
            VERSION=$(sed -n 's/^pkgver=//p' PKGBUILD | tr -d '"' | tr -d "'")
            IS_MANUAL="true"
          fi

          echo "Package Name:     $PKGNAME"
          echo "Detected Version: $VERSION"
          echo "Is Manual Update: $IS_MANUAL"

          # Output core variables
          echo "pkgname=$PKGNAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_manual=$IS_MANUAL" >> "$GITHUB_OUTPUT"

      - name: Resolve Launchpad PPA
        id: resolve-launchpad
        env:
          LAUNCHPAD_PPA: ${{ vars.LAUNCHPAD_PPA || secrets.LAUNCHPAD_PPA }}
        run: printf 'ppa=%s\n' "${LAUNCHPAD_PPA#ppa:}" >> "$GITHUB_OUTPUT"

  update-pypi:
    needs: get-info
    if: needs.get-info.outputs.is_manual == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-python: true
          activate-environment: "true"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  update-aur:
    runs-on: ubuntu-latest
    needs: [get-info, update-pypi]
    if: |
      always() && 
      needs.get-info.result == 'success' && 
      (needs.update-pypi.result == 'success' || needs.update-pypi.result == 'skipped') &&
      !(github.event_name == 'workflow_dispatch' && inputs.target == 'ubuntu')
    environment:
      name: aur
      url: "https://aur.archlinux.org/packages/${{ github.event.repository.name }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Version and Repo Metadata
        id: get_version
        run: |
          # Source the PKGBUILD to get the updated version and release directly
          source PKGBUILD

          # If this is an automatic update, use the version detected by get-info
          VERSION="${{ needs.get-info.outputs.version }}"
          PKGNAME="${{ needs.get-info.outputs.pkgname }}"
          IS_MANUAL="${{ needs.get-info.outputs.is_manual }}"

          echo "PKGNAME=$PKGNAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PKGREL=$pkgrel" >> "$GITHUB_ENV"
          echo "IS_MANUAL=$IS_MANUAL" >> "$GITHUB_ENV"

      - name: Validate Version Format
        run: |
          if [[ ! "${{ env.VERSION }}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "ERROR: Invalid version format detected: '${{ env.VERSION }}'"
            echo "Version must be numeric (e.g., 1.2.3). Stopping workflow."
            exit 1
          fi

      - name: Check Current AUR Version
        id: check_aur
        run: |
          if [ "${{ env.IS_MANUAL }}" == "true" ]; then
             echo "SKIP_UPDATE=false" >> "$GITHUB_ENV"
             echo "Manual update requested. Proceeding."
          else
             AUR_FULL_VERSION=$(curl -s "https://aur.archlinux.org/rpc/v5/info/${{ env.PKGNAME }}" | \
               jq -r '.results[0].Version // empty')

             REPO_FULL_VERSION="${{ env.VERSION }}-${{ env.PKGREL }}"

             echo "Repo version target: $REPO_FULL_VERSION"
             echo "AUR version current: $AUR_FULL_VERSION"

             if [ -z "$AUR_FULL_VERSION" ] || [ "$AUR_FULL_VERSION" == "null" ]; then
               echo "Package not in AUR yet. Proceeding."
               echo "SKIP_UPDATE=false" >> "$GITHUB_ENV"
             elif [ "$AUR_FULL_VERSION" == "$REPO_FULL_VERSION" ]; then
               echo "AUR is already up to date. Skipping."
               echo "SKIP_UPDATE=true" >> "$GITHUB_ENV"
             else
               # Verify if local is actually newer to prevent accidental downgrades
               if echo -e "${AUR_FULL_VERSION}\n${REPO_FULL_VERSION}" | sort -V -C 2>/dev/null; then
                 echo "AUR version is older. Proceeding with update."
                 echo "SKIP_UPDATE=false" >> "$GITHUB_ENV"
               else
                 echo "Warning: AUR version is newer than Local. Skipping to prevent downgrade."
                 echo "SKIP_UPDATE=true" >> "$GITHUB_ENV"
               fi
             fi
          fi

      - name: Update PKGBUILD and Checksums
        if: env.SKIP_UPDATE == 'false'
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e VERSION="${{ env.VERSION }}" \
            -e IS_MANUAL="${{ env.IS_MANUAL }}" \
            archlinux:base-devel sh -c '
              pacman -Sy --noconfirm pacman-contrib git curl
              useradd -m builduser
              chown -R builduser:builduser .

              # Update PKGBUILD with the release version
              if [ "$IS_MANUAL" == "false" ]; then
                echo "Updating PKGBUILD to v$VERSION"
                sed -i "s/^pkgver=.*$/pkgver=$VERSION/" PKGBUILD
                sed -i "s/^pkgrel=.*$/pkgrel=1/" PKGBUILD
              fi

              # Wait for GitHub release tarball to become available (handles 404 race condition)
              echo "Waiting for GitHub release tarball to be ready..."
              su builduser -c "
                for i in $(seq 1 90); do
                  if updpkgsums; then
                    exit 0
                  fi
                  echo \"Attempt \$i: Tarball not ready yet, retrying in 10s...\"
                  sleep 10
                done
                echo \"Error: Failed to fetch tarball after multiple attempts.\"
                exit 1
              "

              su builduser -c "makepkg --printsrcinfo > .SRCINFO"

              # Fix permissions for the GitHub runner user (UID 1001)
              chown -R 1001:121 .
            '

      - name: Publish to AUR
        if: env.SKIP_UPDATE == 'false'
        uses: KSXGitHub/github-actiods-deploy-aur@v4.2.0
        with:
          pkgname: ${{ env.PKGNAME }}
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ env.VERSION }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Trigger MyRepo Build
        if: success() && env.SKIP_UPDATE == 'false'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: mydehq/my-repo
          event-type: trigger-build

  update-winget:
    needs: get-info
    if: needs.get-info.outputs.is_manual == 'false'
    runs-on: ubuntu-latest
    environment:
      name: winget
      url: https://winstall.app/apps/${{ github.repository_owner }}.${{ needs.get-info.outputs.pkgname }}
    steps:
      - name: Publish to Winget
        id: winget-release
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: ${{ github.repository_owner }}.${{ needs.get-info.outputs.pkgname }}
          version: ${{ needs.get-info.outputs.version }}
          release-tag: v${{ needs.get-info.outputs.version }}
          installers-regex: '${{ needs.get-info.outputs.pkgname }}-windows-amd64\.exe$'
          max-versions-to-keep: 4
          token: ${{ secrets.WINGET_TOKEN }}

  update-ubuntu:
    needs: get-info
    if: needs.get-info.outputs.launchpad_ppa != '' && (needs.get-info.outputs.is_manual == 'false' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.get-info.outputs.version }}
          fetch-depth: 0

      - name: Install Ubuntu packaging tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts dh-python dput \
            distro-info-data libdistro-info-perl \
            pybuild-plugin-pyproject python3-all python3-installer \
            python3-setuptools python3-wheel

      - name: Stage Debian packaging and update changelog
        env:
          VERSION: ${{ needs.get-info.outputs.version }}
          DEBFULLNAME: ${{ vars.DEBFULLNAME || 'Soymadip' }}
          DEBEMAIL: ${{ vars.DEBEMAIL || 'soumadip@zohomail.in' }}
        run: |
          cp -a src/debian debian
          CURRENT_VERSION=$(dpkg-parsechangelog -SVersion)
          if [ "$CURRENT_VERSION" != "$VERSION" ]; then
            dch --newversion "$VERSION" --distribution resolute --force-distribution \
              "New upstream release $VERSION."
          fi

      - name: Import Launchpad signing key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.LAUNCHPAD_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.LAUNCHPAD_GPG_PASSPHRASE }}

      - name: Build signed Ubuntu source package
        env:
          VERSION: ${{ needs.get-info.outputs.version }}
          SIGNING_KEY: ${{ steps.import-gpg.outputs.fingerprint }}
        run: dpkg-buildpackage -S -sa --sign-key="$SIGNING_KEY"

      - name: Upload source package to Launchpad PPA
        env:
          LAUNCHPAD_PPA: ${{ needs.get-info.outputs.launchpad_ppa }}
          VERSION: ${{ needs.get-info.outputs.version }}
        run: dput "ppa:$LAUNCHPAD_PPA" "../quikrun_${VERSION}_source.changes"

  build-summary:
    needs: [get-info, update-pypi, update-aur, update-winget, update-ubuntu]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Workflow Summary Report
        run: |
          PYPI_STATUS="${{ needs.update-pypi.result }}"
          AUR_STATUS="${{ needs.update-aur.result }}"
          WINGET_STATUS="${{ needs.update-winget.result }}"
          UBUNTU_STATUS="${{ needs.update-ubuntu.result }}"
          WINGET_PR_URL="${{ needs.update-winget.outputs.pr-url }}"
          PKGNAME="${{ needs.get-info.outputs.pkgname }}"
          VERSION="${{ needs.get-info.outputs.version }}"

          format_status() {
            case "$1" in
              success) echo "✅ Success" ;;
              skipped) echo "⏭️ Skipped" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⚠️ Cancelled" ;;
              *) echo "❓ Unknown ($1)" ;;
            esac
          }

          echo "## Package Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target Platform | Status | Direct Link |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **PyPI** (Python Package) | $(format_status "$PYPI_STATUS") | [View on PyPI](https://pypi.org/project/$PKGNAME/$VERSION/) |" >> $GITHUB_STEP_SUMMARY
          echo "| **AUR** (Arch Linux) | $(format_status "$AUR_STATUS") | [View on AUR](https://aur.archlinux.org/packages/$PKGNAME) |" >> $GITHUB_STEP_SUMMARY

          if [ -n "$WINGET_PR_URL" ] && [ "$WINGET_PR_URL" != "null" ]; then
            WINGET_LINK="[View WinGet PR]($WINGET_PR_URL)"
          else
            WINGET_LINK="[View on Winstall](https://winstall.app/apps/${{ github.repository_owner }}.$PKGNAME)"
          fi

          echo "| **WinGet** (Windows Package) | $(format_status "$WINGET_STATUS") | $WINGET_LINK |" >> $GITHUB_STEP_SUMMARY
          echo "| **Ubuntu PPA** | $(format_status "$UBUNTU_STATUS") | Launchpad PPA |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version Released:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Package Name:** \`$PKGNAME\`" >> $GITHUB_STEP_SUMMARY
