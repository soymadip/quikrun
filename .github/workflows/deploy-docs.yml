name: Deploy Docs
run-name: "Deploy Documentation"

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deploy even if no tags are published"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "docs"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check published tag or force deploy
        id: check
        run: |
          if [ "${{ inputs.force_deploy }}" = "true" ]; then
            echo "Force deploy requested via input."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Triggered by tag push (${{ github.ref_name }})."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git tag --points-at HEAD)" ]; then
            echo "Commit has published tag: $(git tag --points-at HEAD)."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No tag published for current commit and force_deploy is false. Skipping docs deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    environment:
      name: docs
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Build with VitePress
        run: bun run build
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
