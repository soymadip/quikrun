[project]
name          = "quikrun"
version       = "2.4.0"
description   = "Run your code without hassle"
readme        = "README.md"
license       = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors       = [{ name = "Soumadip Das", email = "soumadip+github@zohomail.in" }]

requires-python = ">=3.15"
dependencies    = []

[project.urls]
Homepage   = "https://soymadip.github.io/quikrun"
Repository = "https://github.com/soymadip/quikrun"


[project.scripts]
quikrun = "quikrun.__main__:main"


[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "patchelf>=0.17.2.4; sys_platform == 'linux'",
    "pytest>=9.1.1",
]
