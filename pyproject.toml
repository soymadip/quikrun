[project]
name          = "quikrun"
version = "3.4.0"
description   = "Run your code without hassle"
readme        = "README.md"
license       = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors       = [{ name = "Soumadip Das", email = "soumadip+github@zohomail.in" }]

requires-python = ">=3.14"
dependencies    = []

[project.urls]
Homepage   = "https://soymadip.github.io/quikrun"
Repository = "https://github.com/soymadip/quikrun"


[project.scripts]
quikrun = "quikrun.cli:run_cli"


[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quikrun*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "patchelf>=0.17.2.4; sys_platform == 'linux'",
    "pytest>=9.1.1",
    "pydantic>=2.14.1",
    "tomli-w>=1.2.0",
    "pyinstaller>=6.22.3",
]
